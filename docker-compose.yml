version: '3.9'

services:
    web:
        image: vladshmit1992/homework_7:latest
        build:
            context: .
            dockerfile: Dockerfile
        container_name: materials
        command:
            bash -c "python manage.py migrate &&
                    gunicorn config.wsgi:application --bind 0.0.0.0:8000"
        ports:
            - "8000:8000"
        env_file:
            - ./.env.docker
        volumes:
          - .:/app
          - static_volume:/app/staticfiles
        depends_on:
            - db
            - redis
        networks:
            - app_network
    db:
        image: postgres:16
        container_name: postgres_db
        environment:
            POSTGRES_DB: ${NAME}
            POSTGRES_USER: ${USER}
            POSTGRES_PASSWORD: ${PASSWORD}

        ports:
          - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - app_network
    redis:
        image: redis:7
        container_name: redis
        ports:
            - "6379:6379"
        env_file:
            - ./.env.docker
        volumes:
            - redis_data:/data
        networks:
            - app_network
    celery:
        image: vladshmit1992/homework_7-celery
        build:
            context: .
        container_name: celery_worker
        command:
            celery -A config worker -l INFO
        environment:
            POSTGRES_DB: ${NAME}
            POSTGRES_USER: ${USER}
            POSTGRES_PASSWORD: ${PASSWORD}
        volumes:
            - .:/app
        depends_on:
            - db
            - redis
        networks:
            - app_network

    celery_beat:
        image: vladshmit1992/homework_7-celery-beat
        build:
            context: .
        container_name: celery_beat
        command:
            celery -A config beat --loglevel=INFO
        env_file:
            - ./.env.docker
        volumes:
            - .:/app
        depends_on:
            - db
            - redis
            - celery
        networks:
            - app_network

    nginx:
        image: vladshmit1992/homework_7-nginx:latest
        build:
            context: ./nginx
            dockerfile: Dockerfile
        ports:
            - "80:80"
        volumes:
            - static_volume:/app/staticfiles
        depends_on:
            - web
        networks:
            - app_network
networks:
    app_network:
        driver: bridge
volumes:
    postgres_data:
    redis_data:
    static_volume: